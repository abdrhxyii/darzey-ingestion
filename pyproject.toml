[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalai-data-ingestion"
version = "0.1.0"
description = "Private-first ingestion core for official Sri Lankan legal documents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
production = ["boto3>=1.34", "PyMuPDF>=1.24"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
