name: Backfill Gazettes
on:
  workflow_dispatch:
    inputs:
      from_year: {required: true, type: string}
      to_year: {required: true, type: string}
  schedule: [{cron: "32,2 * * * *"}]
permissions: {contents: read}
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: "gazettes-backfill-${{ inputs.from_year || '2026' }}-${{ inputs.to_year || '2026' }}"
      cancel-in-progress: false
    env:
      GAZETTE_API_BASE_URL: http://203.143.21.148:4500/website-data
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[production]"
      - run: python scripts/backfill_resumable_documents_gov_lk.py --document-type gazette --from-year "${{ inputs.from_year || '2026' }}" --to-year "${{ inputs.to_year || '2026' }}"
