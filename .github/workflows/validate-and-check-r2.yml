name: Validate ingestion and check R2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill_years:
        description: "Years or ranges to backfill; leave empty for the normal sync"
        required: false
        default: ""
        type: string
      backfill_delay_seconds:
        description: "Delay between backfill downloads"
        required: false
        default: "0.25"
        type: string
      backfill_max_documents:
        description: "Optional backfill test limit; 0 means no limit"
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  r2-connectivity:
    name: Read-only R2 connectivity check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R2 client
        run: python -m pip install --upgrade pip && python -m pip install -e ".[production]"

      - name: Check R2 without changing data
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/verify_r2.py

  ingest-extra-gazettes:
    name: Ingest Extra Gazettes
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.backfill_years != '')
    runs-on: ubuntu-latest
    needs: r2-connectivity
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[production]"

      - name: Ingest first page of official Extra Gazettes
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/ingest_extra_gazettes.py

  backfill-extra-gazettes:
    name: Backfill Extra Gazettes
    if: github.event_name == 'workflow_dispatch' && inputs.backfill_years != ''
    runs-on: ubuntu-latest
    needs: r2-connectivity
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[production]"

      - name: Backfill official Extra Gazette archive
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          python scripts/backfill_extra_gazettes.py
          --years "${{ inputs.backfill_years }}"
          --delay-seconds "${{ inputs.backfill_delay_seconds }}"
          --max-documents "${{ inputs.backfill_max_documents }}"
