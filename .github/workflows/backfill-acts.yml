name: Backfill Acts

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: First official archive year to backfill
        required: true
        type: string
      to_year:
        description: Last official archive year to backfill
        required: true
        type: string
      minimum_download_interval_seconds:
        description: Delay between official PDF downloads
        required: false
        default: "0.25"
        type: string

permissions:
  contents: read

jobs:
  backfill:
    name: Preserve Acts archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[production,browser]"

      - name: Install public-page browser
        run: python -m playwright install --with-deps chromium

      - name: Verify official page pagination
        run: python scripts/verify_acts_pagination.py --pages 2

      - name: Backfill selected archive years
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          python scripts/backfill_acts.py
          --from-year "${{ inputs.from_year }}"
          --to-year "${{ inputs.to_year }}"
          --minimum-download-interval-seconds "${{ inputs.minimum_download_interval_seconds }}"
