name: Backfill Extra Gazettes

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years or ranges, for example 2010-2026"
        required: true
        default: "2010-2026"
        type: string
      delay_seconds:
        description: "Delay between PDF downloads"
        required: true
        default: "0.25"
        type: string
      max_documents:
        description: "Optional test limit; use 0 for the full selected range"
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: extra-gazette-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[production]"

      - name: Backfill official Extra Gazette archive
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          python scripts/backfill_extra_gazettes.py
          --years "${{ inputs.years }}"
          --delay-seconds "${{ inputs.delay_seconds }}"
          --max-documents "${{ inputs.max_documents }}"
